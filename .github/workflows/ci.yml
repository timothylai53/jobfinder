name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # tests/conftest.py already blocks real HTTP and the real JobSpy call, and clears JOBFINDER_FAKE_SOURCES
      # (fake mode changes the pacing delays the tests check), so it is deliberately not set here.
      JOBFINDER_NO_SCHEDULER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Type check (mypy)
        run: python -m mypy
      # PDF tests render with headless Chromium (offline) and read the PDF back
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

  e2e:
    # The real UI and API driven by Chromium on fake data (frontend/e2e). Localhost only: the tests abort any other request.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # the backend renders the PDF the test downloads (Python Playwright)
      - run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  windows-install:
    # What a new user does on Windows: setup.bat, start.bat, use it, stop.bat. Checked out into a folder with a space,
    # offline (fake sources, no scheduler) and with a throwaway data folder. The default ports, as a user gets them.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      JOBFINDER_NO_PAUSE: "1"
      JOBFINDER_NO_BROWSER: "1"
      JOBFINDER_FAKE_SOURCES: "1"
      JOBFINDER_NO_SCHEDULER: "1"
      JOBFINDER_NO_AUTO_BACKUP: "1"
      JOBFINDER_DATA_DIR: ${{ github.workspace }}\throwaway data
      JOBFINDER_LOG_DIR: ${{ github.workspace }}\logs
    steps:
      - uses: actions/checkout@v4
        with:
          path: Job Finder
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Job Finder/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Job Finder/frontend/package-lock.json
      - name: setup.bat
        shell: cmd
        run: call "Job Finder\setup.bat"
      - name: start.bat
        shell: cmd
        # The servers keep running after this step. Their output must not go to the step's own pipe, or the runner
        # waits for them to exit (they never do), so start.bat writes to a log file instead.
        timeout-minutes: 5
        run: |
          mkdir "%JOBFINDER_LOG_DIR%"
          call "Job Finder\start.bat" > "%JOBFINDER_LOG_DIR%\start.log" 2>&1 < NUL
          type "%JOBFINDER_LOG_DIR%\start.log"
      - name: Smoke test, then stop.bat
        shell: pwsh
        timeout-minutes: 8
        run: '& "Job Finder\scripts\smoke-windows.ps1"'
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: windows-install-logs
          path: logs
          retention-days: 7
